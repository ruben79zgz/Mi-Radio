name: Build Mi Radio Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, mi-radio-android-native-v1]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-mi-radio-android.yml'

permissions:
  contents: write

concurrency:
  group: mi-radio-android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar plataforma Android
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No encuentro sdkmanager dentro de $SDK_ROOT"
            find "$SDK_ROOT" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          echo "Usando $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Recuperar clave de firma de pruebas
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mi-radio-android-signing-v1

      - name: Preparar firma estable
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            if [ -f downloads/Mi-Radio.apk ]; then
              echo "ERROR: se ha perdido la clave usada por el APK ya publicado."
              echo "No se generará una actualización con firma distinta."
              exit 1
            fi
            keytool -genkeypair -v               -keystore ~/.android/debug.keystore               -storepass android               -alias androiddebugkey               -keypass android               -keyalg RSA -keysize 2048 -validity 10000               -dname "CN=Mi Radio Personal,OU=Mi Radio,O=Mi Radio,L=Zaragoza,C=ES"
          fi

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar APK
        run: gradle -p android-app :app:assembleDebug --stacktrace

      - name: Preparar descarga
        run: |
          mkdir -p downloads
          cp android-app/app/build/outputs/apk/debug/app-debug.apk downloads/Mi-Radio.apk
          sha256sum downloads/Mi-Radio.apk > downloads/Mi-Radio.apk.sha256

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Radio-Android
          path: |
            downloads/Mi-Radio.apk
            downloads/Mi-Radio.apk.sha256
          retention-days: 90

      - name: Publicar APK en GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- downloads/Mi-Radio.apk downloads/Mi-Radio.apk.sha256; then
            echo "APK sin cambios"
            exit 0
          fi
          git config user.name "Mi Radio Android Bot"
          git config user.email "actions@users.noreply.github.com"
          git add downloads/Mi-Radio.apk downloads/Mi-Radio.apk.sha256
          git commit -m "Publicar APK Mi Radio Android"
          git pull --rebase origin main
          git push origin HEAD:main
