name: Actualizar Mi Resultados

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'resultados/scripts/update_scores.py'
      - '.github/workflows/update-resultados.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Actualizar resultados
        run: python resultados/scripts/update_scores.py

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain -- resultados/data/scores.json)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "Mi Resultados Bot"
          git config user.email "actions@users.noreply.github.com"
          git add resultados/data/scores.json
          git commit -m "Actualizar Mi Resultados"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
