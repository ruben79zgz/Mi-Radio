name: Actualizar guía TV

on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_epg.py'
      - 'tv.js'
      - '.github/workflows/update-epg.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Descargar EPG de TDTChannels
        run: python scripts/update_epg.py

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain -- epg-data.json)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "Mi Radio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add epg-data.json
          git commit -m "Actualizar guía TV"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
