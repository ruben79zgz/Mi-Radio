name: Actualizar motor de datos Mi Resultados

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'resultados/scripts/update_engine.py'
      - 'resultados/leagues.js'
      - '.github/workflows/update-resultados-engine.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Actualizar motor
        run: python resultados/scripts/update_engine.py
      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain -- resultados/data/engine.json)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "Mi Resultados Bot"
          git config user.email "actions@users.noreply.github.com"
          git add resultados/data/engine.json
          git commit -m "Actualizar motor de datos Mi Resultados"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
