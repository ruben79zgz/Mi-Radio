name: Actualizar cartelera Zaragoza

on:
  workflow_dispatch:
  schedule:
    - cron: '27 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_cinema.py'
      - '.github/workflows/update-cinema.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Actualizar cartelera
        run: python scripts/update_cinema.py

      - name: Guardar cambios
        run: |
          if [ -z "$(git status --porcelain -- cartelera-data.json)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "Mi Radio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cartelera-data.json
          git commit -m "Actualizar cartelera Zaragoza"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
