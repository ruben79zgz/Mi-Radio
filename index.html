<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Mi Radio" />
  <meta name="referrer" content="no-referrer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Mi Radio</title>
  <link rel="stylesheet" href="styles.css?v=5" />
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">RADIO PERSONAL</div>
      <h1>Mi Radio</h1>
    </div>
    <div class="top-actions">
      <button id="settingsBtn" class="icon-btn" type="button" aria-label="Ajustes" title="Ajustes">⚙</button>
    </div>
  </header>

  <main>
    <section class="toolbar">
      <div id="filters" class="filters" role="tablist" aria-label="Filtros"></div>
      <input id="searchInput" class="search" type="search" placeholder="Buscar emisora…" autocomplete="off" />
    </section>
    <section id="stationsGrid" class="stations-grid" aria-live="polite"></section>
  </main>

  <aside id="playerBar" class="player-bar hidden" aria-live="polite">
    <img id="playerLogo" class="player-logo" alt="" referrerpolicy="no-referrer" />
    <div class="player-meta">
      <div id="playerName" class="player-name">—</div>
      <div id="playerStatus" class="player-status">Preparado</div>
    </div>
    <div class="player-actions">
      <button id="stopBtn" class="round-btn secondary" type="button" aria-label="Detener">■</button>
      <button id="playPauseBtn" class="round-btn primary" type="button" aria-label="Reproducir o pausar">▶</button>
    </div>
  </aside>

  <dialog id="detailsDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">EMISORA</div>
          <h3 id="detailsTitle">Detalles</h3>
        </div>
        <button class="icon-btn" value="cancel" aria-label="Cerrar">✕</button>
      </div>
      <img id="detailsLogo" class="details-logo" alt="" referrerpolicy="no-referrer" />
      <p id="detailsDesc" class="muted"></p>
      <label class="field-label" for="streamField">Enlace principal de stations.js</label>
      <textarea id="streamField" class="stream-field" rows="3" readonly></textarea>
      <div class="dialog-actions">
        <button id="copyStreamBtn" class="btn" type="button">Copiar enlace</button>
      </div>
      <div class="source-note" id="detailsSource"></div>
    </form>
  </dialog>

  <dialog id="settingsDialog" class="dialog">
    <form method="dialog" class="dialog-card">
      <div class="dialog-head">
        <div>
          <div class="eyebrow">AJUSTES</div>
          <h3>Mi Radio</h3>
        </div>
        <button class="icon-btn" value="cancel" aria-label="Cerrar">✕</button>
      </div>
      <p class="muted">Los enlaces definidos en <strong>stations.js</strong> siempre tienen prioridad. La app solo busca un respaldo automático cuando todos los enlaces de una emisora fallan.</p>
      <div class="setting-row">
        <div>
          <strong>Temporizador</strong>
          <small>Detener la radio automáticamente.</small>
        </div>
        <select id="sleepSelect" class="select">
          <option value="0">Desactivado</option>
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
          <option value="90">90 min</option>
        </select>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="none"></audio>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
  <script src="stations.js?v=5"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
